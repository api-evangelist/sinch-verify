aid: sinch-verify
url: https://raw.githubusercontent.com/api-evangelist/sinch-verify/refs/heads/main/apis.yml
name: Sinch Verification API
kind: company
description: >-
  The Sinch Verification API (Sinch Verify) is a dedicated phone number
  verification product for confirming that a user controls a given mobile
  number - the core of OTP, two-factor authentication (2FA), and
  anti-fraud sign-up flows. It supports four verification methods: SMS
  (one-time passcode), flash call (a missed call whose caller ID is the
  code), phone call / callout (a spoken or key-press code), and data
  (seamless / silent verification over the mobile data connection). A
  verification is started from your backend, the code or caller ID is
  reported back, and Sinch returns a pass/fail result; status can also be
  queried by id, by phone number, or by a custom reference. This entry is
  the product-specific treatment of the Verification API; the parent
  company Sinch is a global CPaaS provider (SMS, Voice, Email, Verification,
  Conversation) cataloged separately under the "sinch" provider entry.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Number Verification
- Phone Verification
- OTP
- 2FA
- CPaaS
- SMS Verification
- Flash Call
- Two-Factor Authentication
- Identity Verification
- Sinch
