description: >-
  FinOps view of Sinch Verification spend. Verification is billed per attempt on
  a pay-as-you-go basis, with cost driven primarily by verification volume, the
  method used (SMS, flash call, phone call, data), and the destination
  country/operator. SMS verification carries a per-country/operator SMS price;
  flash call is a fixed, materially lower per-attempt price; phone call and data
  are separately priced. The dominant optimization levers are method mix (favor
  flash call or data where UX allows), destination targeting, and anti-fraud
  velocity controls to suppress wasted attempts and pumping.
notes: >-
  Per-unit rates vary by country/operator and are not reconciled here; pull the
  current price list from the Sinch Build dashboard. Verification pumping (fraud
  that inflates SMS spend) is a real cost risk - budget for anti-fraud controls.
