meters:
- name: sms_verifications
  description: SMS OTP verification attempts, priced per attempt by country/operator.
  unit: verifications
  aggregation: sum
  dimensions:
  - application
  - country
  - method
- name: flashcall_verifications
  description: Flash call verification attempts, fixed per-attempt price by country.
  unit: verifications
  aggregation: sum
  dimensions:
  - application
  - country
  - method
- name: callout_verifications
  description: Phone call (callout) verification attempts, priced per attempt by country.
  unit: verifications
  aggregation: sum
  dimensions:
  - application
  - country
  - method
- name: data_verifications
  description: Data (seamless) verification attempts.
  unit: verifications
  aggregation: sum
  dimensions:
  - application
  - country
  - method
principles:
- name: Visibility
  description: Track verification attempts per method, country, and application; watch for spikes indicating pumping.
- name: Allocation
  description: Use application keys and the reference field to map verification spend to products and teams.
- name: Optimization
  description: Shift to flash call or data verification where UX allows, restrict high-cost destinations, and enforce velocity limits to cut wasted attempts.
- name: Accountability
  description: Assign owners per application; review monthly attempt volume and fraud signals against budget.
